rules:

  high_fat_risk:
    rule_id: RR001
    name: "High fat risk"
    severity: high
    explanation: "Fat content exceeds 20g/100g — may cause obesity or pancreatitis"
    condition:
      type: nutrition_threshold
      field: fat_100g
      operator: ">"
      value: 20

  cat_food_missing_taurine:
    rule_id: RR002
    name: "Cat food missing taurine"
    severity: critical
    explanation: "Cat food must contain taurine — deficiency causes heart disease and vision problems"
    condition:
      type: ingredient_absence
      target_species: cat
      missing_ingredient: taurine

  chicken_allergy_risk:
    rule_id: RR003
    name: "Chicken allergy risk"
    severity: medium
    explanation: "Contains chicken or chicken meal — risk for pets with chicken allergy"
    condition:
      type: ingredient_match
      match_ingredients:
        - chicken
        - chicken meal

  senior_cat_high_phosphorus:
    rule_id: RR004
    name: "Senior cat high phosphorus"
    severity: high
    explanation: "Senior cat food phosphorus exceeds 0.8g/100g — may increase kidney burden"
    condition:
      type: compound
      target_species: cat
      life_stage: senior
      nutrition_threshold:
        field: phosphorus_100g
        operator: ">"
        value: 0.8

  low_protein_kitten_risk:
    rule_id: RR005
    name: "Kitten low protein"
    severity: high
    explanation: "Kitten food protein below 30g/100g — insufficient for rapid growth"
    condition:
      type: compound
      target_species: cat
      life_stage: kitten
      nutrition_threshold:
        field: protein_100g
        operator: "<"
        value: 30
