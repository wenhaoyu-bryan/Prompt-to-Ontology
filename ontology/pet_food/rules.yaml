rules:

  high_fat_risk:
    rule_id: RR001
    name: "高脂肪风险"
    severity: high
    explanation: "脂肪含量超过 20g/100g，可能导致肥胖或胰腺炎"
    condition:
      type: nutrition_threshold
      field: fat_100g
      operator: ">"
      value: 20

  cat_food_missing_taurine:
    rule_id: RR002
    name: "猫粮缺少牛磺酸"
    severity: critical
    explanation: "猫粮必须含有牛磺酸，缺乏会导致心脏病和视力问题"
    condition:
      type: ingredient_absence
      target_species: cat
      missing_ingredient: taurine

  chicken_allergy_risk:
    rule_id: RR003
    name: "鸡肉过敏风险"
    severity: medium
    explanation: "含有鸡肉或鸡肉粉，对鸡肉过敏的宠物存在风险"
    condition:
      type: ingredient_match
      match_ingredients:
        - chicken
        - chicken meal

  senior_cat_high_phosphorus:
    rule_id: RR004
    name: "老年猫高磷风险"
    severity: high
    explanation: "老年猫粮磷含量超过 0.8g/100g，可能加重肾脏负担"
    condition:
      type: compound
      target_species: cat
      life_stage: senior
      nutrition_threshold:
        field: phosphorus_100g
        operator: ">"
        value: 0.8

  low_protein_kitten_risk:
    rule_id: RR005
    name: "幼猫蛋白质不足"
    severity: high
    explanation: "幼猫粮蛋白质低于 30g/100g，无法满足幼猫快速生长需求"
    condition:
      type: compound
      target_species: cat
      life_stage: kitten
      nutrition_threshold:
        field: protein_100g
        operator: "<"
        value: 30
