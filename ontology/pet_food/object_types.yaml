object_types:

  PetFoodProduct:
    description: "Pet food product"
    properties:
      - product_id
      - barcode
      - product_name
      - category
      - target_species
      - life_stage
      - country
      - protein_100g
      - fat_100g
      - fiber_100g
      - moisture_100g
      - ash_100g
      - phosphorus_100g
      - calcium_100g

  Brand:
    description: "Pet food brand"
    properties:
      - brand_id
      - brand_name
      - country

  Ingredient:
    description: "Food ingredient"
    properties:
      - ingredient_id
      - ingredient_name
      - ingredient_type
      - risk_tag
      - common_allergen

  RiskRule:
    description: "Nutrition/ingredient risk rule"
    properties:
      - rule_id
      - rule_name
      - severity
      - explanation

  Species:
    description: "Target species"
    properties:
      - species_id
      - species_name

  LifeStage:
    description: "Life stage"
    properties:
      - stage_id
      - stage_name
