action_types:

  ExplainProductRisk:
    description: "Explain risk rules triggered by a product and the reasons"
    params:
      - product_id

  RecommendAlternativeProduct:
    description: "Recommend alternatives that avoid the same risks"
    params:
      - product_id
      - species
      - life_stage

  CreateWatchlist:
    description: "Add product to watchlist for ongoing risk tracking"
    params:
      - product_id
      - reason

  GenerateIngredientReport:
    description: "Generate product ingredient analysis report"
    params:
      - product_id
