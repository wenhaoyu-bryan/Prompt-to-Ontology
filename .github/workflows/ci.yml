name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend module checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend

      - name: Check Python syntax
        run: python -m compileall -q .
        working-directory: backend

      - name: Run backend unit checks
        run: |
          PYTHONPATH=. python -m unittest discover -s tests
          python scripts/test_ontology_kernel.py
          python scripts/test_data_pipeline.py
          python scripts/test_custom_csv_pipeline.py
          python scripts/test_review_queue.py
          python scripts/test_agent_operator.py
          python scripts/test_agent_suggestion_quality.py
          python scripts/test_agent_trace.py
          python scripts/test_build_scenario.py
          python scripts/test_scenario_run.py
          python scripts/test_demo_admin.py
        working-directory: backend

      - name: Check release version rules
        run: python scripts/test_release_version.py

      - name: Check version files agree
        run: python scripts/release_version.py "$(cat VERSION)" --files-only

  backend-integration:
    name: Neo4j integration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/ci-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: backend

      - name: Run graph snapshot and relationship checks
        run: |
          python scripts/test_graph_snapshot.py
          python scripts/test_relationship_csv_pipeline.py
        working-directory: backend

      - name: Seed Rule Studio fixture
        run: |
          python - <<'PY'
          from neo4j_connector import get_driver

          with get_driver().session() as session:
              session.run(
                  """
                  MERGE (p:PetFoodProduct {id: $id})
                  SET p.name = $name,
                      p.target_species = $species,
                      p.life_stage = $life_stage,
                      p.fat_100g = $fat
                  """,
                  id="ci-pf-001",
                  name="CI Test Product",
                  species="Cat",
                  life_stage="Adult",
                  fat=12,
              )
          PY
        working-directory: backend

      - name: Run Rule Studio checks
        run: python scripts/test_rule_studio.py
        working-directory: backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  ui-smoke:
    name: Playwright UI smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend test dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start disposable demo stack
        run: docker compose up --build --wait -d

      - name: Run baseline browser smoke tests
        run: npx playwright test tests/smoke/routes.spec.js tests/smoke/responsive.spec.js --workers=1
        working-directory: frontend

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100

      - name: Stop disposable demo stack
        if: always()
        run: docker compose down --volumes
